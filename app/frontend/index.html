<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TGS STORE</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; padding: 20px; }
        h1 { color: #00d2ff; text-transform: uppercase; border-bottom: 2px solid #00d2ff; padding-bottom: 10px; }
        .status { background: #16222f; padding: 15px; border-radius: 5px; margin-top: 20px; border-left: 5px solid #00d2ff; font-size: 18px; }
        .sucesso { border-left-color: #00ff88; color: #00ff88; }
        .erro { border-left-color: #ff3366; color: #ff3366; }
    </style>
</head>
<body>
    <h1>Tech Games Support - TGS STORE</h1>
    <div id="status-box" class="status">
        Conectando ao catálogo online da loja...
    </div>

    <script>
        // Caminho oficial do catálogo no seu GitHub Pages
        const urlCatalogo = '../../catalog/tgs_apps_homebrews.json';

        // Tenta buscar o arquivo no servidor de forma dinâmica
        fetch(urlCatalogo)
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar o arquivo');
                return response.json();
            })
            .then(data => {
                // Se conseguir ler o JSON com sucesso
                const box = document.getElementById('status-box');
                box.className = 'status sucesso';
                box.innerHTML = `<strong>Sucesso:</strong> Conectado à ${data.store}! Catálogo de ID "${data.catalog_id}" lido perfeitamente e pronto para o PS4.`;
            })
            .catch(error => {
                // Se o arquivo estiver ausente ou com erro de sintaxe
                const box = document.getElementById('status-box');
                box.className = 'status erro';
                box.innerHTML = `<strong>Erro de Conexão:</strong> Não foi possível ler o banco de dados da loja.`;
            });
    </script>
</body>
</html>
